<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan Fusion Hdg - Zinc Consumption Calculator</title>
    <!-- Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Titan Fusion">
    
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --card-border: #262626;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --accent: #f0f0f0;
            --accent-glow: rgba(240, 240, 240, 0.08);
            --highlight: #d4d4d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding-top: 24px;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group:last-of-type {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="number"], select {
            flex: 1;
            padding: 14px 16px;
            font-size: 18px;
            font-weight: 500;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background: #1a1a1a;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--highlight);
            background: #202020;
        }

        select {
            max-width: 100px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            opacity: 0.85;
            transform: scale(0.99);
        }

        .results-card {
            display: none;
            background: linear-gradient(145deg, #141414, #1c1c1c);
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
        }

        .results-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--text-main);
        }

        .results-card.active {
            display: block;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-item {
            margin-bottom: 16px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
            letter-spacing: -0.5px;
        }

        .result-value span {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #555557;
            margin-top: 24px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Titan Fusion Hdg</h1>
            <p>Zinc Consumption System</p>
        </header>

        <div class="card">
            <div class="input-group">
                <label for="beforeWeight">Before Weight</label>
                <div class="input-row">
                    <input type="number" id="beforeWeight" placeholder="0.00" step="any" inputmode="decimal">
                    <select id="beforeUnit">
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="afterWeight">After Weight</label>
                <div class="input-row">
                    <input type="number" id="afterWeight" placeholder="0.00" step="any" inputmode="decimal">
                    <select id="afterUnit">
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                    </select>
                </div>
            </div>

            <button class="btn" onclick="calculateZinc()">Calculate Consumption</button>
        </div>

        <div class="card results-card" id="resultsCard">
            <div class="result-item">
                <div class="result-label">Amount Gone (Difference)</div>
                <div class="result-value" id="diffValue">0.00 <span>kg</span></div>
            </div>
            <hr style="border:0; border-top:1px solid var(--card-border); margin: 16px 0;">
            <div class="result-item">
                <div class="result-label">Consumption Percentage</div>
                <div class="result-value" id="percentValue">0.00%</div>
            </div>
        </div>

        <div class="footer">
            TITAN FUSION CAST & FORGE &copy; 2026
        </div>
    </div>

    <script>
        function calculateZinc() {
            let beforeVal = parseFloat(document.getElementById('beforeWeight').value);
            let beforeUnit = document.getElementById('beforeUnit').value;
            
            let afterVal = parseFloat(document.getElementById('afterWeight').value);
            let afterUnit = document.getElementById('afterUnit').value;

            if (isNaN(beforeVal) || isNaN(afterVal)) {
                alert("Please enter valid numbers for both weights.");
                return;
            }

            let beforeInGrams = beforeUnit === 'kg' ? beforeVal * 1000 : beforeVal;
            let afterInGrams = afterUnit === 'kg' ? afterVal * 1000 : afterVal;

            let diffInGrams = beforeInGrams - afterInGrams;
            let percentage = (beforeInGrams > 0) ? (Math.abs(diffInGrams) / beforeInGrams) * 100 : 0;

            let diffDisplayStr = "";
            if (Math.abs(diffInGrams) >= 1000) {
                let diffInKg = diffInGrams / 1000;
                diffDisplayStr = diffInKg.toFixed(3) + " <span>kg</span>";
            } else {
                diffDisplayStr = diffInGrams.toFixed(2) + " <span>g</span>";
            }

            document.getElementById('diffValue').innerHTML = diffDisplayStr;
            document.getElementById('percentValue').innerText = percentage.toFixed(2) + "%";

            document.getElementById('resultsCard').classList.add('active');
        }
    </script>
</body>
</html>
